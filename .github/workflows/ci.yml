name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  api-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image as compose.yaml. The credentials are throwaway
        # placeholders for this job's container, not secrets.
        image: postgres:18.6
        env:
          POSTGRES_USER: ielts_prep
          POSTGRES_PASSWORD: ielts_prep
          POSTGRES_DB: ielts_prep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ielts_prep -d ielts_prep"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://ielts_prep:ielts_prep@localhost:5432/ielts_prep
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Builds the database from the committed migrations, then checks that
      # it matches schema.prisma (.claude/rules/backend/database.md).
      - run: pnpm --filter api db:deploy
      - run: pnpm --filter api db:check
      - run: pnpm --filter api test:e2e

# Local development database (pnpm db:up / pnpm db:down). The credentials are
# placeholders that match apps/api/.env.example, not secrets.
name: ielts-prep

services:
  postgres:
    # Pinned to major and minor; the CI service container uses the same image.
    image: postgres:18.6
    environment:
      POSTGRES_USER: ielts_prep
      POSTGRES_PASSWORD: ielts_prep
      POSTGRES_DB: ielts_prep
    ports:
      # Reachable from this machine only.
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18+ images keep their data under /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Over TCP: during first-time setup the image runs a temporary server
      # that answers on the Unix socket only, so a socket check passes too early.
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-U",
          "ielts_prep",
          "-d",
          "ielts_prep",
        ]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
